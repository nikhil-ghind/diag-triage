# Minimal single-node Elasticsearch for the triage store. For production use the
# ECK operator or a managed cluster; this is the smallest thing that works.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: diag-elasticsearch
  labels: { app: diag-elasticsearch }
spec:
  serviceName: diag-elasticsearch
  replicas: 1
  selector:
    matchLabels: { app: diag-elasticsearch }
  template:
    metadata:
      labels: { app: diag-elasticsearch }
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms2g -Xmx2g" }
          ports:
            - { containerPort: 9200, name: http }
          resources:
            requests: { cpu: "1", memory: 3Gi }
            limits:   { cpu: "2", memory: 4Gi }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: diag-elasticsearch
spec:
  selector: { app: diag-elasticsearch }
  ports:
    - { port: 9200, targetPort: 9200 }
