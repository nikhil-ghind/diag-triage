<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Log lines from many hosts are parsed and normalized to a signature, clustered into a single incident, triaged by an agent, then routed to alert sinks">
  <title>diag_triage: many log lines collapse to one incident, then one agent run</title>

  <text x="16" y="26" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold">diag_triage — deterministic detection first, LLM last</text>

  <!-- stage boxes -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">
    <rect x="16" y="60" width="130" height="200" rx="8" fill="none" stroke="#6e7681" stroke-width="1.5"/>
    <text x="81" y="82" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">host forwarders</text>
    <text x="81" y="100" text-anchor="middle">dmesg / journald</text>
    <text x="81" y="118" text-anchor="middle">POST /v1/ingest</text>

    <rect x="196" y="100" width="140" height="120" rx="8" fill="none" stroke="#6e7681" stroke-width="1.5"/>
    <text x="266" y="128" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">parse</text>
    <text x="266" y="148" text-anchor="middle">classify subsystem</text>
    <text x="266" y="166" text-anchor="middle">normalize_signature</text>
    <text x="266" y="184" text-anchor="middle">mask hex / ids</text>
    <text x="266" y="204" text-anchor="middle" font-size="12">bulk index → ES</text>

    <rect x="386" y="100" width="140" height="120" rx="8" fill="none" stroke="#6e7681" stroke-width="1.5"/>
    <text x="456" y="128" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">detect + cluster</text>
    <text x="456" y="148" text-anchor="middle">rules + rate z-score</text>
    <text x="456" y="166" text-anchor="middle">group by</text>
    <text x="456" y="184" text-anchor="middle">(subsystem, signature)</text>
    <text x="456" y="204" text-anchor="middle" font-size="12">500 lines → 1 incident</text>

    <rect x="576" y="100" width="140" height="120" rx="8" fill="none" stroke="#6e7681" stroke-width="1.5"/>
    <text x="646" y="128" text-anchor="middle" fill="#d29922" font-size="13" font-weight="bold">triage agent</text>
    <text x="646" y="148" text-anchor="middle">Claude + MCP tools</text>
    <text x="646" y="166" text-anchor="middle">bounded tool loop</text>
    <text x="646" y="184" text-anchor="middle">submit_triage</text>
    <text x="646" y="204" text-anchor="middle" font-size="12">once per incident</text>

    <rect x="766" y="100" width="98" height="120" rx="8" fill="none" stroke="#6e7681" stroke-width="1.5"/>
    <text x="815" y="128" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="bold">router</text>
    <text x="815" y="150" text-anchor="middle">PagerDuty</text>
    <text x="815" y="170" text-anchor="middle">Slack</text>
    <text x="815" y="190" text-anchor="middle">log sink</text>
    <text x="815" y="210" text-anchor="middle" font-size="12">throttled</text>
  </g>

  <!-- connector lines -->
  <g stroke="#6e7681" stroke-width="1.5" fill="none">
    <line x1="146" y1="160" x2="196" y2="160"/>
    <line x1="336" y1="160" x2="386" y2="160"/>
    <line x1="526" y1="160" x2="576" y2="160"/>
    <line x1="716" y1="160" x2="766" y2="160"/>
  </g>

  <!-- Elasticsearch store, read back by the agent's tools -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">
    <rect x="336" y="290" width="240" height="52" rx="8" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="456" y="312" text-anchor="middle" fill="#a371f7" font-size="13" font-weight="bold">Elasticsearch</text>
    <text x="456" y="331" text-anchor="middle">diag-logs · diag-incidents</text>
    <path d="M266 220 L266 316 L336 316" stroke="#6e7681" stroke-width="1.5" fill="none"/>
    <path d="M646 220 L646 316 L576 316" stroke="#6e7681" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
    <text x="700" y="292" text-anchor="middle" font-size="12">tool reads</text>
  </g>

  <!-- animated log lines fanning in from many hosts -->
  <g>
    <circle r="4.5" fill="#58a6ff">
      <animateMotion path="M100,90 L266,160 L456,160" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#58a6ff">
      <animateMotion path="M100,130 L266,160 L456,160" dur="3s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="3s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#58a6ff">
      <animateMotion path="M100,170 L266,160 L456,160" dur="3s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#58a6ff">
      <animateMotion path="M100,210 L266,160 L456,160" dur="3s" begin="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="3s" begin="1.05s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#58a6ff">
      <animateMotion path="M100,250 L266,160 L456,160" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the single incident leaving the cluster stage -->
  <g>
    <circle r="7" fill="#d29922">
      <animateMotion path="M456,160 L646,160" dur="3s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.7;1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- the alert leaving the agent -->
  <g>
    <circle r="7" fill="#3fb950">
      <animateMotion path="M646,160 L815,160" dur="3s" begin="2.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.7;1" dur="3s" begin="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">
    <text x="16" y="366">Every line is parsed and indexed · only clustered incidents reach the model · one alert per fingerprint per throttle window</text>
  </g>
</svg>
