[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diag-triage"
version = "0.1.0"
description = "LLM-integrated observability pipeline: ingest kernel/driver hardware diagnostic logs into Elasticsearch, triage failures with a Claude agent over MCP, and route alerts for scale-out clusters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "elasticsearch[async]>=8.13",
    "anthropic>=0.40",
    "mcp>=1.2",
    "httpx>=0.27",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
diag-triage = "triage.app.cli:app"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
